<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
        }

        header {
            background: #173b70;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #173b70;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #245493;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #173b70;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>College Lost & Found Portal</h1>
</header>

<div class="container">

    <h2>Report Lost Item</h2>

    <form id="lostForm">

        <label>Student Name</label>
        <input type="text" id="student" required>

        <label>Item Name</label>
        <input type="text" id="item"
        placeholder="Example: ID Card" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>ID Card</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Lost Location</label>
        <input type="text" id="location"
        placeholder="Example: Library" required>

        <label>Lost Date</label>
        <input type="date" id="date" required>

        <label>Description</label>
        <textarea id="description" rows="4"
        placeholder="Describe your lost item"></textarea>

        <button type="submit">Submit Lost Report</button>

    </form>

    <p id="message"></p>

    <a href="index.html">Back to Home</a>

</div>

<script>
document.getElementById("lostForm").addEventListener(
    "submit", async function(event) {

    event.preventDefault();

    const itemData = {
        student_name: document.getElementById("student").value,
        item_name: document.getElementById("item").value,
        category: document.getElementById("category").value,
        location: document.getElementById("location").value,
        item_date: document.getElementById("date").value,
        description: document.getElementById("description").value,
        type: "Lost"
    };

    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/items", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(itemData)
        });

        const result = await response.json();

        if (response.ok) {
            message.textContent = "Item saved successfully!";
            message.style.color = "green";
            document.getElementById("lostForm").reset();
        } else {
            message.textContent =
                result.message || "Unable to save item.";
            message.style.color = "red";
        }

    } catch (error) {
        message.textContent =
            "Server connection failed. Please try again.";
        message.style.color = "red";
    }
});
</script>

</body>
</html>
