<!DOCTYPE html>
<html>
<head>
    <title>Report Found Item</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
        }

        header {
            background: #173b70;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #173b70;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #245493;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>College Lost & Found Portal</h1>
</header>

<div class="container">

    <h2>Report Found Item</h2>

    <form id="foundForm">

        <label>Student Name</label>
        <input type="text" id="student" required>

        <label>Item Name</label>
        <input type="text" id="item" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>ID Card</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Found Location</label>
        <input type="text" id="location" required>

        <label>Found Date</label>
        <input type="date" id="date" required>

        <label>Description</label>
        <textarea id="description" rows="4"></textarea>

        <button type="submit">Submit Found Report</button>

    </form>

    <p id="message"></p>
<a href="index.html">Back to Home</a>
</div>

<script>

    document.getElementById("foundForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const itemData = {
            student_name: document.getElementById("student").value,
            item_name: document.getElementById("item").value,
            category: document.getElementById("category").value,
            location: document.getElementById("location").value,
            item_date: document.getElementById("date").value,
            description: document.getElementById("description").value,
            type: "Found"
        };

        const message = document.getElementById("message");

        try {

            const response = await fetch("/api/items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(itemData)
            });

            const result = await response.json();

            if (response.ok) {

                message.textContent = result.message;
                message.style.color = "green";

                document.getElementById("foundForm").reset();

            } else {

                message.textContent = result.message || "Unable to save item.";
                message.style.color = "red";

            }

        } catch (error) {

            message.textContent =
                "Server connection failed. Please try again.";

            message.style.color = "red";

        }

    });

</script>

</body>
</html>
